[package]
name = "square-rulerpack-native"
version = "0.2.0"
edition = "2021"
license = "MIT"
description = "Lars Rocha's square-rulerpack quadratic sieve (Rust) as a Python extension module."
repository = "https://github.com/oppressionslayer/square-rulerpack-py"
authors = ["Lars Rocha"]
readme = "README.md"

[lib]
name = "square_rulerpack_native"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.30", features = ["extension-module", "abi3-py310", "num-bigint"] }
square-rulerpack = "0.2.0"
rulerpack = { version = "0.3.1", features = ["big"] }
num-bigint = "0.4"
num-traits = "0.2"
rayon = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
